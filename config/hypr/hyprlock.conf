
# =====================
# General
# =====================
general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

# =====================
# Background
# =====================
background {
    monitor =
    path = /usr/share/wallpapers/sai/greentext.jpg
    blur_passes = 3
    blur_size = 8
}

# =====================
# Input Field (Password box)
# =====================
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false

    position = 0, -50
    halign = center
    valign = center

    rounding = 8

    # Colors
    outer_color = rgb(90,90,90)
    inner_color = rgb(20,20,20)
    font_color = rgb(220,220,220)
    check_color = rgb(100,200,100)
    fail_color = rgb(200,80,80)
}

# =====================
# Time
# =====================
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 64
    font_family = JetBrains Mono

    position = 0, 100
    halign = center
    valign = center

    color = rgb(230,230,230)
}

# =====================
# Date
# =====================
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = JetBrains Mono

    position = 0, 160
    halign = center
    valign = center

    color = rgb(180,180,180)
}
